<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="赤いマント:アザゼルのダンジョン公式クーポン。最新のイベントクーポンと報酬を確認してコードをコピーしよう。">
<link rel="canonical" href="https://darkyungul-prog.github.io/ja/coupons/">
<meta name="theme-color" content="#100c11">
<title>赤いマント クーポン | 赤いマント:アザゼルのダンジョン公式イベントクーポン</title>
<style>
:root{--bg:#0c0b0e;--panel:#21191d;--line:#54383b;--gold:#edc080;--muted:#bda9a4;--red:#c13f3b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 0,#48212a,transparent 40%),var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#f5eee9;min-height:100vh}header{padding:24px max(5vw,20px);display:flex;justify-content:space-between;border-bottom:1px solid var(--line);align-items:center}a{color:inherit;text-decoration:none}header a{font-weight:900;color:var(--gold)}header .back{font-size:13px;color:#dfd2ca}main{max-width:1050px;margin:0 auto;padding:65px 24px 100px}.eyebrow{font-size:12px;letter-spacing:.2em;color:#e5aa76;font-weight:900}h1{font-size:clamp(35px,5vw,60px);letter-spacing:-.055em;margin:10px 0 20px}p{color:var(--muted);line-height:1.8}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:45px}.coupon{border:1px solid #704044;background:linear-gradient(140deg,#2d1c23,#191519);border-radius:13px;padding:27px;position:relative;overflow:hidden}.coupon:before{content:'✦';position:absolute;right:-13px;top:-46px;font-size:170px;color:#b9483520;transform:rotate(15deg)}.coupon>*{position:relative}.badge{display:inline-block;border:1px solid #a46b58;padding:6px 10px;color:#fac18d;font-size:11px;font-weight:800;border-radius:20px}.coupon h2{font-size:20px;margin:17px 0 8px}.code{display:block;font-size:clamp(22px,3vw,33px);color:var(--gold);font-weight:950;letter-spacing:.065em;overflow-wrap:anywhere;padding:16px 0}.rewards{font-size:13px;color:#e2c3ad;line-height:1.8}.detail{font-size:12px;color:#a99692;margin:18px 0}button{cursor:pointer;background:var(--red);color:white;padding:13px 23px;border:1px solid #e87463;border-radius:5px;font-weight:900;font:inherit}button:hover{background:#df4a43}.status{border:1px solid var(--line);border-radius:10px;padding:25px;background:var(--panel);margin-top:30px;color:var(--muted)}.foot{margin-top:40px;color:#a7918a;font-size:12px;border-top:1px solid #4b3032;padding-top:24px}@media(max-width:700px){.cards{grid-template-columns:1fr}main{padding:45px 17px}.coupon{padding:23px}}
</style>
</head>
<body><header><a href="/ja/">✦ 赤いマント:アザゼルのダンジョン</a><a href="/ja/" class="back">ホームに戻る ↗</a></header>
<main><div class="eyebrow">OFFICIAL COUPON BOARD</div><h1>イベントクーポン</h1><p>現在使える公式クーポンを確認しよう。<br>コードをコピーしてゲーム内のクーポン入力画面で使ってください。</p>
<div id="status" class="status" role="status">クーポンを確認しています…</div>
<div class="list-wrap"><table class="coupon-table" aria-label="公式イベントクーポン一覧">
<thead><tr><th>クーポン名</th><th>コード</th><th>報酬</th><th>有効期限</th><th>コピー</th></tr></thead>
<tbody id="couponRows"></tbody></table></div>
<div class="foot">クーポンは1アカウント1回まで使用でき、期限や使用人数に達すると使えなくなります。報酬はゲームサーバーから付与されます。</div>
</main>
<style>
.list-wrap{margin-top:34px;border:1px solid #694549;border-radius:14px;overflow:hidden;background:#1c161b;box-shadow:0 18px 42px #0005}
.coupon-table{width:100%;border-collapse:collapse;table-layout:fixed}
.coupon-table th{text-align:left;padding:18px 15px;color:#f1c68f;font-size:13px;background:#2b1d23;border-bottom:1px solid #6c4749}
.coupon-table td{padding:22px 15px;border-bottom:1px solid #51363a;vertical-align:middle;font-size:14px;line-height:1.65;overflow-wrap:anywhere}
.coupon-table tr:last-child td{border-bottom:0}
.coupon-table th:nth-child(1){width:19%}.coupon-table th:nth-child(2){width:19%}.coupon-table th:nth-child(3){width:27%}.coupon-table th:nth-child(4){width:15%}.coupon-table th:nth-child(5){width:20%}
.coupon-name{font-weight:850;color:#f7e3d4}.coupon-code{font-weight:900;color:#f5c886;letter-spacing:.03em}.coupon-reward{color:#ead5c6}.coupon-muted{font-size:13px;color:#c7aaa5}.coupon-table th:last-child,.coupon-table td:last-child{padding-left:20px;padding-right:24px}.coupon-table button{font-size:12px;padding:11px 9px;width:100%;max-width:150px;white-space:nowrap}
@media(max-width:850px){.coupon-table thead{display:none}.list-wrap{background:transparent;border:0;box-shadow:none}.coupon-table,.coupon-table tbody,.coupon-table tr,.coupon-table td{display:block;width:100%}.coupon-table tr{background:#21191d;border:1px solid #694549;border-radius:12px;margin-bottom:13px;padding:10px 16px}.coupon-table td{display:grid;grid-template-columns:94px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid #483238}.coupon-table td:before{content:attr(data-label);font-size:12px;font-weight:800;color:#d8ae83}.coupon-table td:last-child{border:0;padding:10px 0}.coupon-table button{justify-self:start;max-width:160px}.coupon-table td:first-child{font-size:16px}}
</style>
<script>
const ENDPOINT='https://dungeon-stick-server-production.up.railway.app/api/event/public/coupons';
const $=id=>document.getElementById(id);
const labels={coins:'ゴールド',tickets:'挑戦券',drawTickets:'装備ガチャ券'};
const parseReward=r=>{const parts=[];const gems=(Number(r?.red)||0)+(Number(r?.gems)||0);if(gems>0)parts.push('宝石 '+gems.toLocaleString());for(const [k,v] of Object.entries(r||{}))if(labels[k]&&Number(v)>0)parts.push(labels[k]+' '+Number(v).toLocaleString());return parts.join(' · ')};
async function load(){
  try{
    const response=await fetch(ENDPOINT,{cache:'no-store'});
    if(!response.ok)throw Error('ゲームサーバーからクーポン情報を取得できません。');
    const data=await response.json(),now=Date.now()/1000;
    const list=(data.coupons||[]).filter(c=>c.code&&(!c.expires||c.expires>now)&&(!c.maxUses||c.uses<c.maxUses)).sort((a,b)=>b.publishedAt-a.publishedAt);
    $('status').textContent=list.length?'':'現在公開中のクーポンはありません。新しいイベントをお待ちください。';
    $('status').style.display=list.length?'none':'block';
    const parent=$('couponRows');parent.replaceChildren();
    for(const c of list){
      const tr=document.createElement('tr');
      const columns=[
        ['クーポン名',c.memo||'イベントクーポン','coupon-name'],
        ['コード',c.code,'coupon-code'],
        ['報酬',parseReward(c.reward)||'ゲーム内報酬','coupon-reward'],
        ['有効期限',c.expires?new Date(c.expires*1000).toLocaleDateString('ja-JP'):'期限なし','coupon-muted']
      ];
      for(const [label,value,className] of columns){const td=document.createElement('td');td.dataset.label=label;td.className=className;td.textContent=value;tr.append(td)}
      const action=document.createElement('td');action.dataset.label='コピー';
      const button=document.createElement('button');button.type='button';button.textContent='コードをコピー';
      button.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(c.code);button.textContent='コピー完了 ✓';setTimeout(()=>button.textContent='コードをコピー',1800)}catch{button.textContent='長押ししてコードをコピー'}});
      action.append(button);tr.append(action);parent.append(tr);
    }
  }catch(error){$('status').textContent=error.message||'クーポン情報を読み込めませんでした。';$('status').style.display='block'}
}
load();
</script>
</body></html>
