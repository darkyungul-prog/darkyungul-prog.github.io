<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="赤いマント:アザゼルのダンジョンのお問い合わせ。不具合・決済・アカウントについて。">
<link rel="canonical" href="https://darkyungul-prog.github.io/ja/support/">
<meta name="theme-color" content="#100c11">
<title>お問い合わせ | 赤いマント:アザゼルのダンジョン</title>
<style>
:root{--bg:#0c0b0e;--panel:#21191d;--line:#54383b;--gold:#edc080;--muted:#bda9a4;--red:#c13f3b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 0,#48212a,transparent 40%),var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR","Noto Sans JP","Noto Sans TC",sans-serif;color:#f5eee9;min-height:100vh}header{padding:24px max(5vw,20px);display:flex;justify-content:space-between;border-bottom:1px solid var(--line);align-items:center;gap:12px}a{color:inherit;text-decoration:none}header a{font-weight:900;color:var(--gold)}header .back{font-size:13px;color:#dfd2ca}main{max-width:820px;margin:0 auto;padding:60px 22px 100px}.eyebrow{font-size:12px;letter-spacing:.2em;color:#e5aa76;font-weight:900}h1{font-size:clamp(34px,5vw,56px);letter-spacing:-.05em;margin:10px 0 16px}h2{font-size:20px;margin:44px 0 14px}p{color:var(--muted);line-height:1.8}
form,.box{border:1px solid #694549;border-radius:14px;background:#1c161b;padding:26px;margin-top:26px}label{display:block;font-size:13px;font-weight:800;color:#f1c68f;margin:16px 0 8px}label:first-child{margin-top:0}input,select,textarea{width:100%;background:#120f13;border:1px solid #5b3d41;border-radius:8px;color:#f5eee9;padding:13px;font:inherit;font-size:15px}textarea{min-height:180px;resize:vertical;line-height:1.6}input:focus,select:focus,textarea:focus{outline:2px solid #c9874f;border-color:transparent}
.who{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--panel);font-size:14px;color:#e8d7cc;line-height:1.7}.who a{color:var(--gold);text-decoration:underline}button{cursor:pointer;background:var(--red);color:white;padding:14px 26px;border:1px solid #e87463;border-radius:6px;font-weight:900;font:inherit;margin-top:22px}button:disabled{opacity:.6}.status{margin-top:16px;font-size:14px;line-height:1.7}.status.ok{color:#9fe0a8}.status.error{color:#ff9a8a}.count{font-size:12px;color:#a99692;text-align:right;margin-top:6px}
.item{border-top:1px solid #4b3032;padding:16px 0}.item:first-child{border-top:0;padding-top:0}.item b{color:#f7e3d4}.item .meta{font-size:12px;color:#a99692;margin:4px 0 8px}.item .q{white-space:pre-wrap;color:#d9c6bd;font-size:14px;line-height:1.7}.item .r{white-space:pre-wrap;margin-top:10px;padding:12px 14px;border-left:3px solid var(--gold);background:#2a1f20;border-radius:0 8px 8px 0;font-size:14px;line-height:1.7}.pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid #a46b58;color:#fac18d;margin-left:6px}.foot{margin-top:40px;color:#a7918a;font-size:12px;border-top:1px solid #4b3032;padding-top:22px}.hidden{display:none}
</style>
</head>
<body><header><a href="/ja/">✦ 赤いマント:アザゼルのダンジョン</a><a href="/ja/" class="back">ホームページに戻る ↗</a></header>
<main><div class="eyebrow">SUPPORT</div><h1>お問い合わせ</h1><p>不具合、決済、アカウントの問題やご意見をお送りください。運営チームが確認してお返事します。</p>
<div id="who" class="who"></div>
<form id="form">
<label for="category">種類</label><select id="category"><option value="bug">不具合</option><option value="payment">決済</option><option value="account">アカウント</option><option value="suggest">ご意見</option><option value="etc">その他</option></select>
<label for="title">件名</label><input id="title" maxlength="60" placeholder="例：ステージ50で画面が止まります">
<label for="body">内容</label><textarea id="body" maxlength="2000" required placeholder="いつ・どこで・どのように起きたか詳しく書いていただくと早く対応できます。（決済の場合はGPA.で始まる注文番号もご記入ください）"></textarea><div class="count" id="count">0 / 2,000</div>
<div id="emailBox"><label for="email">返信先メールアドレス</label><input id="email" type="email" maxlength="120" placeholder="you@example.com" autocomplete="email"></div>
<button id="send" type="submit">送信する</button>
<div id="status" class="status" role="status"></div>
</form>
<section id="mineBox" class="hidden"><h2>自分のお問い合わせ</h2><div class="box" id="mine"></div></section>
<div class="foot">パスワードやカード番号などは絶対に書かないでください。運営チームがパスワードを尋ねることはありません。</div>
</main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
const API='https://dungeon-stick-server-production.up.railway.app',T={"send": "送信する", "sending": "送信中…", "ok": "お問い合わせを受け付けました。確認後にお返事します。", "okGame": " ゲームアカウントへの返信はゲーム内の郵便にも届きます。", "logged": "🎮 ゲームアカウントでログイン中：", "loggedHint": "アカウント情報が一緒に送られるので、メールは省略できます。", "guest": "ログインしていません。返信先のメールアドレスを必ずご記入ください。", "mine": "自分のお問い合わせ", "none": "まだお問い合わせはありません。", "st": {"open": "確認中", "answered": "返信済み", "closed": "対応完了"}, "reply": "運営チームの返信", "err": "サーバーに接続できませんでした。しばらくしてからお試しください。"},LANG='ja',COMMUNITY='/ja/community/',LOGIN_LINK="コミュニティでゲームアカウントにログイン";
const auth=getAuth(initializeApp({apiKey:'AIzaSyBo49I2sQgC8CF3EdVrwjRWgX6MI01gfBc',authDomain:'dungeon-stick.firebaseapp.com',projectId:'dungeon-stick'}));
const $=id=>document.getElementById(id);let user=null;
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function status(t,ok){$('status').textContent=t;$('status').className='status '+(ok?'ok':'error')}
async function post(path,body,authed){const h={'Content-Type':'application/json'};if(authed)h.Authorization='Bearer '+await auth.currentUser.getIdToken();const r=await fetch(API+path,{method:'POST',headers:h,body:JSON.stringify(body),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||T.err);return d}
function who(){const w=$('who');w.replaceChildren();if(user){w.append(T.logged,el('b','',user.displayName||user.email||''),el('br'),T.loggedHint)}else{const a=el('a','',LOGIN_LINK);a.href=COMMUNITY;w.append(T.guest,el('br'),a)}$('email').required=!user}
async function mine(){if(!user){$('mineBox').classList.add('hidden');return}try{const d=await post('/api/inquiry/mine',{},true),box=$('mine');box.replaceChildren();$('mineBox').classList.remove('hidden');
 if(!d.inquiries.length){box.append(el('p','',T.none));return}
 for(const q of d.inquiries){const it=el('div','item'),h=el('div');h.append(el('b','',q.title),el('span','pill',T.st[q.status]||q.status));it.append(h,el('div','meta',new Date(q.created*1000).toLocaleString()),el('div','q',q.body));if(q.reply){const r=el('div','r');r.append(el('b','',T.reply),el('br'),q.reply);it.append(r)}box.append(it)}}catch(e){}}
onAuthStateChanged(auth,u=>{user=u;who();mine()});
$('body').addEventListener('input',()=>{$('count').textContent=$('body').value.length.toLocaleString()+' / 2,000'});
$('form').addEventListener('submit',async ev=>{ev.preventDefault();const b={category:$('category').value,title:$('title').value,body:$('body').value,email:$('email').value.trim(),lang:LANG};
 $('send').disabled=true;$('send').textContent=T.sending;try{await post(user?'/api/inquiry/send':'/api/inquiry/public/send',b,!!user);status(T.ok+(user?T.okGame:''),true);$('form').reset();$('count').textContent='0 / 2,000';mine()}catch(e){status(/Failed to fetch|NetworkError/i.test(e.message)?T.err:e.message)}finally{$('send').disabled=false;$('send').textContent=T.send}});
who();
</script>
</body>
</html>
